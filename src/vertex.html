<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vertex</title>

    <!-- Resolve the theme before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- An easter egg has no business in a search index. -->
    <meta name="robots" content="noindex, follow" />

    <meta
      name="theme-color"
      content="#1c1a17"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f1ea"
      media="(prefers-color-scheme: light)"
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link
      rel="preload"
      href="/fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="wrap">
      <!-- Same running head as the main page. -->
      <header class="masthead mono">
        <div class="masthead-left">
          <span class="pmark" aria-hidden="true"></span>
          <span> Manila · <span id="clock">--:--</span> </span>
        </div>
        <button
          class="theme-toggle"
          id="themeToggle"
          type="button"
          aria-live="polite"
        >
          <span id="themeLabel">Day edition</span>
        </button>
      </header>

      <main class="vertex-main">
        <p class="vertex-fortune" id="fortune">Consulting the oracle…</p>
        <img
          class="vertex-kitty"
          src="/dancingkitty.gif"
          alt="A cat, dancing"
          width="400"
          height="238"
        />
        <p class="vertex-back mono">
          <a href="/">Back to the front page</a>
        </p>
      </main>

      <footer class="site-footer">
        <span class="monogram">JHA</span>
        <span class="mono muted">
          <!-- BUILD_YEAR -->
        </span>
      </footer>
    </div>

    <script type="module" src="./scripts.js"></script>
    <script>
      // The one third-party request on the whole site, and it is a joke.
      // If it fails, the page is still funny.
      fetch('https://api.adviceslip.com/advice', { cache: 'no-cache' })
        .then(function (res) {
          return res.json();
        })
        .then(function (data) {
          document.getElementById('fortune').textContent = data.slip.advice;
        })
        .catch(function () {
          document.getElementById('fortune').textContent =
            'The fortune cookie was empty.';
        });
    </script>
  </body>
</html>
